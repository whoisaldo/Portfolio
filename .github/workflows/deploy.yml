name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # The analytics beacon. Unset, src/lib/beacon.js registers nothing and
          # sends nothing — which is the correct behaviour for a fork, and for
          # any build without the stats service.
          VITE_STATS_ENDPOINT: https://stats.aliyounes.dev/api/collect
          # Where the blog's comments are kept. Unset, posts have no comments
          # section. See src/front/Comments.jsx.
          VITE_COMMENTS_API: https://stats.aliyounes.dev
      - run: cp dist/index.html dist/404.html     # SPA refresh fix
      # The braindance gets a real page, so a link to it is not a 404.
      - run: mkdir -p dist/braindance && cp dist/index.html dist/braindance/index.html
      # So do the playground, the blog and every post, each with its own title
      # and link preview, so a post shared on X unfurls as itself. /recruiters,
      # the address on the résumé, gets a page that forwards to the homepage.
      - run: node scripts/static-pages.mjs dist
      # The built site is what goes public, résumé included. A phone number or
      # an email other than aldo@ and hello@sideband.studio stops the deploy,
      # and the last good one stays live. scripts/check-sensitive.py has the rules.
      - run: python3 -m pip install --quiet pypdf && python3 scripts/check-sensitive.py dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
