name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # The analytics beacon. Unset, src/lib/beacon.js registers nothing and
          # sends nothing — which is the correct behaviour for a fork, and for
          # any build made before stats-api is deployed. See stats-api/README.md.
          VITE_STATS_ENDPOINT: https://stats.aliyounes.dev/api/collect
      - run: cp dist/index.html dist/404.html     # SPA refresh fix
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
