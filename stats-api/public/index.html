<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Signal · aliyounes.dev</title>
<!--
  The private dashboard.

  Served from stats.aliyounes.dev, never from the portfolio itself. That is the
  whole reason it is a separate page rather than a /stats route in the SPA:
  none of this markup ships to a visitor, and the session cookie that unlocks
  it belongs to a domain the portfolio never touches.

  No framework and no build step. It is a few fetches and some DOM, it is
  looked at by one person, and a toolchain here would be more code than the
  page. Routes are the hash: #/visitors, #/v/<visitor>, #/s/<visit>, #/links,
  #/hits.

  Palette is lifted from the portfolio's tailwind.config.js so the two read as
  one system: ink #0e0d14, signal #7b45f7, hud #6d5fa8, ember #ff9538.
-->
<style>
  :root{
    --ink:#0e0d14; --ink-raised:#16151c; --line:#221f2e;
    --bone:#efece5; --muted:rgb(239 236 229/.72); --dim:rgb(239 236 229/.55);
    --faint:rgb(239 236 229/.34);
    --signal:#7b45f7; --signal-soft:#9b72ff; --hud:#8b7dc8;
    --ember:#ff9538; --ok:#36d686; --err:#ff3d64;
    --mono:ui-monospace,"JetBrains Mono",SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--ink);color:var(--bone);font-family:var(--mono);
    font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased;
    padding:clamp(.9rem,3vw,2.5rem);
  }
  a{color:var(--signal-soft);text-underline-offset:3px}
  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--signal-soft);outline-offset:2px}
  h1{font-size:15px;letter-spacing:.18em;text-transform:uppercase;margin:0;font-weight:600}
  h2{
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--hud);margin:2.25rem 0 .75rem;font-weight:500;
  }
  header{
    display:flex;flex-wrap:wrap;gap:.9rem 1.5rem;align-items:center;
    justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:1rem;
  }
  nav{display:flex;flex-wrap:wrap;gap:.25rem}
  nav a{
    color:var(--dim);text-decoration:none;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    padding:.4rem .65rem;border:1px solid transparent;
  }
  nav a:hover{color:var(--bone)}
  nav a[aria-current="page"]{color:var(--bone);border-color:var(--line);background:var(--ink-raised)}
  .ctl{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center}
  button,.btn{
    font:inherit;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    background:transparent;color:var(--dim);border:1px solid var(--line);
    padding:.4rem .7rem;cursor:pointer;transition:color .15s,border-color .15s;text-decoration:none;
    display:inline-flex;align-items:center;gap:.4rem;min-height:2rem;
  }
  button:hover,.btn:hover{color:var(--bone);border-color:var(--hud)}
  button[aria-pressed="true"],button.primary{background:var(--signal);border-color:var(--signal);color:#fff;font-weight:700}
  button.danger{color:var(--err);border-color:rgb(255 61 100/.4)}
  button:disabled{opacity:.5;cursor:default}

  .live{
    margin-top:1rem;padding:.7rem .9rem;border:1px solid var(--line);background:var(--ink-raised);
    display:flex;gap:.6rem 1.2rem;flex-wrap:wrap;align-items:baseline;
  }
  .live b{color:var(--ok);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:11px}
  .live b::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:.5rem;vertical-align:1px}

  /* Headline tiles. Value dominant, label subordinate, no chrome. */
  /* Hairlines drawn by each cell, not by a gap over a filled grid, so an
     unfilled last row stays empty instead of showing a block of line colour. */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-top:1.25rem;border-top:1px solid var(--line);border-left:1px solid var(--line)}
  .tile{padding:.9rem 1rem;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  .tile .v{font-size:24px;line-height:1.15;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .tile .l{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--hud);margin-top:.35rem}
  .tile .s{font-size:11px;color:var(--dim);margin-top:.1rem}

  .wrap{overflow-x:auto;border:1px solid var(--line);-webkit-overflow-scrolling:touch}
  table{border-collapse:collapse;width:100%}
  th,td{text-align:left;padding:.5rem .75rem;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
  th{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--hud);font-weight:500;background:var(--ink-raised)}
  tbody tr:hover{background:var(--ink-raised)}
  tbody tr:last-child td{border-bottom:0}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  td.w{white-space:normal;min-width:16ch;max-width:44ch}
  td a{text-decoration:none}
  td a:hover{text-decoration:underline}

  .tag{font-size:9px;letter-spacing:.14em;text-transform:uppercase;padding:.08rem .38rem;border:1px solid currentColor;white-space:nowrap;display:inline-block;line-height:1.5}
  .corporate,.recruiter{color:var(--ember)}
  .education,.friend{color:var(--signal-soft)}
  .consumer,.unknown,.other,.relay{color:var(--faint)}
  .hosting,.bot{color:var(--err)}
  .me{color:var(--ok)}

  /* Inline bar. A number you can compare at a glance without a chart library. */
  .bar{display:block;height:3px;background:var(--signal);opacity:.75;margin-top:.3rem;min-width:1px}
  .spark{display:flex;align-items:flex-end;gap:2px;height:56px;margin-top:.5rem}
  .spark i{flex:1;min-width:2px;background:var(--hud);opacity:.55;min-height:1px}
  .spark i.has{background:var(--ember);opacity:1}
  .axis{display:flex;justify-content:space-between;font-size:10px;color:var(--faint);margin-top:.35rem}
  .cols{display:grid;gap:0 2rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
  .muted{color:var(--dim)} .faint{color:var(--faint)} .ok{color:var(--ok)} .em{color:var(--ember)} .err{color:var(--err)}
  .empty{padding:1.1rem;color:var(--dim);margin:0}
  .chips{display:flex;gap:.35rem;flex-wrap:wrap;margin:1.25rem 0 .75rem}

  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);margin:0}
  .facts div{padding:.55rem .8rem;min-width:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  .facts dt{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--hud)}
  .facts dd{margin:.1rem 0 0;overflow-wrap:anywhere}
  .reasons{list-style:none;padding:0;margin:.5rem 0 0}
  .reasons li{padding:.15rem 0}
  .reasons li::before{content:"·";margin-right:.6rem;color:var(--faint)}
  .reasons li.recruiter::before{content:"+R";color:var(--ember)}
  .reasons li.friend::before{content:"+F";color:var(--signal-soft)}
  .big{font-size:20px;letter-spacing:-.01em;margin:.4rem 0 .2rem;line-height:1.3}

  .timeline{border-left:1px solid var(--line);margin:.5rem 0 0 .4rem;padding-left:1rem}
  .timeline div{padding:.12rem 0;display:flex;gap:.9rem}
  .timeline .t{color:var(--faint);min-width:4.5em;font-variant-numeric:tabular-nums}
  .timeline .k{color:var(--hud);min-width:6.5em}
  .visit{border:1px solid var(--line);padding:.8rem .9rem;margin-top:.75rem}
  .visit summary{cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;gap:.3rem .9rem;align-items:baseline}
  .visit summary::-webkit-details-marker{display:none}
  .visit summary::before{content:"▸";color:var(--faint)}
  .visit[open] summary::before{content:"▾"}

  form.box{border:1px solid var(--line);padding:1rem;display:grid;gap:.75rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));align-items:end}
  label{display:grid;gap:.3rem;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--hud)}
  input,select,textarea{
    font:inherit;font-size:13px;letter-spacing:0;text-transform:none;width:100%;background:var(--ink-raised);
    border:1px solid var(--line);color:var(--bone);padding:.55rem .7rem;border-radius:0;
  }
  textarea{min-height:4.5rem;resize:vertical}
  .made{border:1px solid var(--signal);padding:.9rem 1rem;margin-top:.75rem;background:rgb(123 69 247/.08)}
  .made code{overflow-wrap:anywhere}
  .row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin:.3rem 0}

  #gate{max-width:30rem;margin:14vh auto;text-align:left}
  #gate form{display:grid;gap:.75rem;margin-top:1rem}
  #err{color:var(--err);min-height:1.2em}
  footer{margin:2.5rem 0 1rem;font-size:11px;color:var(--dim);display:flex;gap:.5rem 1rem;flex-wrap:wrap}
  footer button{font-size:10px;min-height:1.6rem;padding:.2rem .5rem}
  @media (max-width:560px){ th,td{padding:.45rem .55rem} .tile .v{font-size:20px} }
</style>
</head>
<body>
<div id="gate" hidden>
  <h1>Signal</h1>
  <p class="muted" style="margin-top:.75rem">Private dashboard for aliyounes.dev.</p>
  <form id="login">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="primary" type="submit">Sign in</button>
    <div id="err" role="alert"></div>
  </form>
</div>

<div id="app" hidden>
  <header>
    <div>
      <h1>Signal</h1>
      <p class="muted" id="sub" style="margin:.2rem 0 0;font-size:11px"></p>
    </div>
    <nav aria-label="Views">
      <a href="#/">Overview</a>
      <a href="#/visitors">Visitors</a>
      <a href="#/visits">Visits</a>
      <a href="#/links">Links</a>
      <a href="#/hits">Shares</a>
    </nav>
    <div class="ctl" id="ctl"></div>
  </header>
  <main id="view"></main>
  <footer>
    <span id="gen"></span>
    <button type="button" data-act="signout">Sign out</button>
  </footer>
</div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const SITE = "https://aliyounes.dev";
const HERE = location.origin;

let DAYS = Number(localStorage.getItem("ay.days")) || 30;
let BOTS = localStorage.getItem("ay.bots") === "1";
let ME = localStorage.getItem("ay.me") === "1";
let DATA = null;
let FILTER = "all";
let MADE = null;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const dur = (ms) => {
  if (!ms || ms < 1000) return "–";
  const s = Math.round(ms / 1000);
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m " + String(s % 60).padStart(2, "0") + "s";
  return Math.floor(s / 3600) + "h " + String(Math.floor((s % 3600) / 60)).padStart(2, "0") + "m";
};
const when = (iso) => {
  if (!iso) return "–";
  const d = new Date(iso), mins = Math.round((Date.now() - d) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + "m ago";
  if (mins < 1440) return Math.floor(mins / 60) + "h ago";
  if (mins < 10080) return Math.floor(mins / 1440) + "d ago";
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
};
const stamp = (iso) => iso ? new Date(iso).toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "–";
const pct = (n, d) => (d > 0 ? Math.round((n / d) * 100) + "%" : "–");
const place = (r) => [r.city, r.region, r.country].filter(Boolean).join(", ") || "–";
const device = (r) => `${r.browser || "?"} · ${r.os || "?"}${r.is_mobile ? " · phone" : ""}`;
const tag = (cls, text = cls) => `<span class="tag ${esc(cls)}">${esc(text)}</span>`;
const verdictTag = (v) => tag(v, v === "unknown" ? "?" : v);
const who = (r) => r.visitor_label || r.label || r.org_label || r.org || "unknown network";

function table(head, rows, empty) {
  if (!rows.length) return `<div class="wrap"><p class="empty">${esc(empty)}</p></div>`;
  return `<div class="wrap"><table><thead><tr>${
    head.map((h) => `<th${h.n ? ' class="n"' : ""}>${esc(h.t ?? h)}</th>`).join("")
  }</tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
}

async function api(path, opts) {
  const res = await fetch(path, { credentials: "same-origin", ...opts });
  if (res.status === 404 && path.startsWith("/api/query") && !path.includes("view=")) throw Object.assign(new Error("signed out"), { gate: true });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `Request failed (${res.status})`);
  return body;
}
const post = (body) => api("/api/admin", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });

// ---------------------------------------------------------------------------
// Views
// ---------------------------------------------------------------------------

function liveStrip(d) {
  if (!d.live.length) return "";
  return `<div class="live" aria-live="polite"><b>${d.live.length} on the site now</b>${
    d.live.map((s) => `<a href="#/s/${esc(s.id)}">${esc(who(s))}</a> <span class="muted">${esc(s.city || "")} · ${esc(s.landing_path || "/")} · ${dur(s.total_ms)}</span>`).join(" ")
  }</div>`;
}

function overview(d) {
  const t = d.totals;
  const maxDay = Math.max(1, ...d.daily.map((x) => x.sessions));
  const tiles = [
    { v: t.sessions, l: "Visits", s: `${t.visitors} people` },
    { v: t.returning, l: "Came back", s: pct(t.returning, t.visitors) + " of people" },
    { v: t.recruiter, l: "Likely recruiters", s: `${t.friend} likely friends`, c: "em" },
    { v: t.resume_sessions, l: "Résumé opened", s: pct(t.resume_sessions, t.sessions) + " of visits", c: "ok" },
    { v: t.named_org_sessions, l: "Named orgs", s: "company or school network" },
    { v: dur(t.median_ms), l: "Median visit", s: `mean ${dur(t.avg_ms)}` },
    { v: t.avg_scroll + "%", l: "Mean scroll" },
    { v: pct(t.bounces, t.sessions), l: "Bounced", s: `${t.bounces} one-event visits` },
  ];
  const maxSec = Math.max(1, ...d.sections.map((x) => x.avg_ms));
  return `
    ${liveStrip(d)}
    <div class="tiles">${tiles.map((x) => `<div class="tile">
      <div class="v ${x.c || ""}">${esc(x.v)}</div><div class="l">${esc(x.l)}</div>
      ${x.s ? `<div class="s">${esc(x.s)}</div>` : ""}</div>`).join("")}</div>

    <h2>Visits per day <span class="faint" style="letter-spacing:0;text-transform:none">· orange = a likely recruiter that day</span></h2>
    <div class="spark" role="img" aria-label="Visits per day over the last ${d.days} days">${d.daily.map((x) =>
      `<i class="${x.recruiter ? "has" : ""}" style="height:${x.sessions ? Math.max(5, (x.sessions / maxDay) * 100) : 1}%"
          title="${esc(x.day)}: ${x.sessions} visit${x.sessions === 1 ? "" : "s"}, ${x.recruiter} likely recruiter, ${x.resume_hits} résumé"></i>`).join("")}</div>
    <div class="axis"><span>${esc(d.daily[0]?.day || "")}</span><span>${esc(d.daily.at(-1)?.day || "")}</span></div>

    <h2>Latest people</h2>
    ${visitorTable(d.visitors.slice(0, 12), "Nobody yet. Once the collector is live, open the site once.")}
    <p style="margin:.6rem 0 0"><a href="#/visitors">All ${d.visitors.length} visitors →</a></p>

    <h2>Who: the networks behind the traffic</h2>
    ${table(
      ["Organisation", "Kind", "Where", { t: "Visits", n: 1 }, { t: "People", n: 1 }, { t: "Avg time", n: 1 }, { t: "Résumé", n: 1 }, "Last seen"],
      d.orgs.map((o) => `<tr>
        <td class="w">${esc(o.label)}</td>
        <td>${tag(o.org_kind)}</td>
        <td class="muted">${esc(o.cities.join(", ") || "–")}</td>
        <td class="n">${o.sessions}</td><td class="n">${o.visitors}</td>
        <td class="n">${dur(o.avg_ms)}</td>
        <td class="n ${o.resume_hits ? "ok" : "muted"}">${o.resume_hits || "–"}</td>
        <td class="muted">${esc(when(o.last_seen))}</td></tr>`),
      "No visits in this window.")}

    <h2>Résumé opened by</h2>
    ${visitTable(d.resume_sessions, "No résumé opens in this window.")}

    <div class="cols">
      <div>
        <h2>What gets read</h2>
        ${table(["Section", { t: "Visits", n: 1 }, { t: "Avg dwell", n: 1 }],
          d.sections.map((s) => `<tr><td>${esc(s.section)}<span class="bar" style="width:${(s.avg_ms / maxSec) * 100}%"></span></td>
            <td class="n">${s.sessions}</td><td class="n">${dur(s.avg_ms)}</td></tr>`),
          "No section reads yet.")}
      </div>
      <div>
        <h2>Where they come from</h2>
        ${table(["Referrer", { t: "Visits", n: 1 }, { t: "Résumé", n: 1 }],
          d.referrers.map((r) => `<tr><td>${esc(r.key)}</td><td class="n">${r.sessions}</td>
            <td class="n ${r.resume_hits ? "ok" : "muted"}">${r.resume_hits || "–"}</td></tr>`),
          "No referrers yet.")}
      </div>
      <div>
        <h2>What they pressed</h2>
        ${table(["Kind", "What", { t: "Visits", n: 1 }],
          d.clicks.map((c) => `<tr><td class="muted">${esc(c.type)}</td><td class="w">${esc(c.name)}</td><td class="n">${c.sessions}</td></tr>`),
          "Nothing pressed yet.")}
      </div>
      <div>
        <h2>Pages</h2>
        ${table(["Path", { t: "Views", n: 1 }, { t: "Visits", n: 1 }],
          d.pages.map((p) => `<tr><td class="w">${esc(p.path)}</td><td class="n">${p.views}</td><td class="n">${p.sessions}</td></tr>`),
          "No page views yet.")}
      </div>
      <div>
        <h2>Places</h2>
        ${table(["Place", { t: "Visits", n: 1 }],
          d.places.map((x) => `<tr><td>${esc(x.key)}</td><td class="n">${x.sessions}</td></tr>`), "–")}
      </div>
      <div>
        <h2>Devices</h2>
        ${table(["Browser · OS", { t: "Visits", n: 1 }],
          d.devices.map((x) => `<tr><td>${esc(x.key)}</td><td class="n">${x.sessions}</td></tr>`), "–")}
      </div>
    </div>`;
}

function visitorTable(list, empty) {
  return table(
    ["Who", "Looks like", { t: "Visits", n: 1 }, "Last seen", "Where", "Device", { t: "Time", n: 1 }, { t: "Résumé", n: 1 }, "Link"],
    list.map((v) => `<tr>
      <td class="w"><a href="#/v/${encodeURIComponent(v.id)}">${esc(v.label || v.orgs[0] || "unknown")}</a><br><span class="faint">${
        esc([v.label ? v.orgs[0] : null, v.places[0] || place(v)].filter(Boolean).join(" · "))}</span></td>
      <td>${verdictTag(v.verdict)}</td>
      <td class="n ${v.total_sessions > 1 ? "em" : ""}">${v.total_sessions}</td>
      <td class="muted">${esc(when(v.last_seen))}</td>
      <td class="muted">${esc(v.places.join(" / ") || place(v))}</td>
      <td class="muted">${esc(device(v))}</td>
      <td class="n">${dur(v.total_ms)}</td>
      <td class="n ${v.resume_hits ? "ok" : "muted"}">${v.resume_hits || "–"}</td>
      <td class="muted">${esc(v.link || "–")}</td></tr>`),
    empty);
}

function visitTable(list, empty) {
  return table(
    ["When", "Who", "Looks like", "Where", "From", "Device", { t: "Time", n: 1 }, { t: "Scroll", n: 1 }, "Saw"],
    list.map((s) => `<tr>
      <td class="muted"><a href="#/s/${esc(s.id)}">${esc(when(s.started_at))}</a></td>
      <td class="w"><a href="#/v/${encodeURIComponent(s.visitor_id)}">${esc(who(s))}</a>${
        s.visitor_sessions > 1 ? ` <span class="faint">×${s.visitor_sessions}</span>` : ""}${
        s.is_bot ? " " + tag("bot", s.bot_reason) : ""}</td>
      <td>${verdictTag(s.verdict)}</td>
      <td class="muted">${esc(place(s))}</td>
      <td class="muted">${esc(s.link_label ? "link: " + s.link_label : s.src ? "code: " + s.src : s.referrer_host || "direct")}</td>
      <td class="muted">${esc(device(s))}</td>
      <td class="n">${dur(s.total_ms)}</td>
      <td class="n">${s.max_scroll_pct}%</td>
      <td class="muted w">${esc([
        s.pages > 1 ? s.pages + " pages" : null,
        (s.projects || []).length ? "projects: " + s.projects.join(", ") : s.deepest_section,
        s.resume_hits ? "résumé" : null,
      ].filter(Boolean).join(" · ") || "–")}</td></tr>`),
    empty);
}

function visitors(d) {
  const filters = {
    all: () => true,
    recruiter: (v) => v.verdict === "recruiter",
    friend: (v) => v.verdict === "friend",
    unknown: (v) => v.verdict === "unknown",
    returning: (v) => v.total_sessions > 1,
    labelled: (v) => v.label,
  };
  const list = d.visitors.filter(filters[FILTER] || filters.all);
  return `
    ${liveStrip(d)}
    <div class="chips" role="group" aria-label="Filter visitors">${Object.keys(filters).map((k) =>
      `<button type="button" data-filter="${k}" aria-pressed="${FILTER === k}">${k} · ${d.visitors.filter(filters[k]).length}</button>`).join("")}</div>
    ${visitorTable(list, "Nobody matches.")}
    <p class="faint" style="margin-top:1rem">One row per browser. The same person on a phone and a laptop is two rows until you give both the same label.
    "Looks like" is a guess from weak signals; open a visitor to see the reasons, and label them to settle it.</p>`;
}

function visits(d) {
  return `${liveStrip(d)}<h2>Latest ${d.recent.length} visits</h2>${visitTable(d.recent, "No visits in this window.")}`;
}

function reasonsList(reasons) {
  if (!reasons.length) return `<p class="muted">Nothing to go on.</p>`;
  return `<ul class="reasons">${reasons.map((r) => `<li class="${esc(r.side)}">${esc(r.text)}</li>`).join("")}</ul>`;
}

const LABELS = {
  pageview: "opened", section: "read", resume: "résumé", outbound: "left for", contact: "email",
  click: "pressed", door: "door", console: "console", command: "ran", intro: "intro", end: "left",
};
function timeline(events, t0) {
  if (!events.length) return `<p class="muted">No events.</p>`;
  const start = new Date(t0 || events[0].at).getTime();
  const rel = (at) => {
    const s = Math.max(0, Math.round((new Date(at) - start) / 1000));
    return `+${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  };
  return `<div class="timeline">${events.map((e) => `<div>
    <span class="t">${rel(e.at)}</span><span class="k">${esc(LABELS[e.type] || e.type)}</span>
    <span>${esc(e.type === "pageview" ? e.path : e.name || e.path || "")}${e.dwell_ms ? ` <span class="faint">${dur(e.dwell_ms)}</span>` : ""}</span>
  </div>`).join("")}</div>`;
}

async function visitorView(id) {
  const d = await api(`/api/query?view=visitor&id=${encodeURIComponent(id)}`);
  const v = d.visitor, sum = d.summary;
  const bySession = new Map();
  for (const e of d.events) (bySession.get(e.session_id) || bySession.set(e.session_id, []).get(e.session_id)).push(e);
  return `
    <p style="margin-top:1.25rem"><a href="#/visitors">← Visitors</a></p>
    <div class="big">${esc(v.label || sum?.orgs[0] || "Unknown visitor")} ${verdictTag(sum?.verdict || "unknown")}</div>
    <p class="muted" style="margin:0">${v.sessions} visit${v.sessions === 1 ? "" : "s"} · first ${esc(stamp(v.first_seen))} · last ${esc(when(v.last_seen))}${
      v.first_src ? ` · first came through <b>${esc(v.first_src)}</b>` : ""}</p>

    <div class="cols">
      <div>
        <h2>Why it looks that way</h2>
        ${reasonsList(sum?.reasons || [])}
      </div>
      <div>
        <h2>Label</h2>
        <form class="box" id="label-form" data-id="${esc(v.id)}">
          <label>Name<input name="label" value="${esc(v.label || "")}" placeholder="Jane at Amazon" maxlength="120"></label>
          <label>Is
            <select name="kind">${["", "recruiter", "friend", "me", "other"].map((k) =>
              `<option value="${k}" ${(v.kind || "") === k ? "selected" : ""}>${k || "let it guess"}</option>`).join("")}</select>
          </label>
          <label style="grid-column:1/-1">Note<textarea name="note" maxlength="1000">${esc(v.note || "")}</textarea></label>
          <div class="row"><button class="primary" type="submit">Save</button><span id="saved" class="ok" role="status"></span></div>
        </form>
      </div>
    </div>

    ${d.siblings.length ? `<h2>Other browsers at the same address</h2>
      <p class="faint" style="margin:-.25rem 0 .6rem">On a home connection, probably the same person on another device. At an office, campus or on a phone carrier, probably not.</p>
      ${table(["Who", "Device", { t: "Visits", n: 1 }, "Last seen"],
        d.siblings.map((s) => `<tr><td><a href="#/v/${encodeURIComponent(s.id)}">${esc(s.label || s.org || s.id)}</a> ${s.kind ? tag(s.kind) : ""}</td>
          <td class="muted">${esc(s.device)}</td><td class="n">${s.sessions}</td><td class="muted">${esc(when(s.last_seen))}</td></tr>`), "")}` : ""}

    <h2>Visits</h2>
    ${d.sessions.map((s, i) => `<details class="visit" ${i === 0 ? "open" : ""}>
      <summary><b>${esc(stamp(s.started_at))}</b> ${verdictTag(s.verdict)}
        <span class="muted">${esc(s.org_label || "")} · ${esc(place(s))} · ${esc(s.referrer_host || (s.src ? "link " + s.src : "direct"))} · ${dur(s.total_ms)} · ${s.max_scroll_pct}%</span>
        <a href="#/s/${esc(s.id)}">details</a></summary>
      ${timeline(bySession.get(s.id) || [], s.started_at)}
    </details>`).join("")}

    <h2>Danger</h2>
    <button class="danger" type="button" data-act="forget" data-id="${esc(v.id)}">Erase this visitor and all their visits</button>
    <p class="faint">For clearing out your own test traffic. To keep counting yourself out instead, set "Is" to me.</p>`;
}

async function sessionView(id) {
  const { session: s, events } = await api(`/api/query?view=session&id=${encodeURIComponent(id)}`);
  const vpn = s.client_tz && s.ip_timezone && s.client_tz !== s.ip_timezone;
  const fact = (k, v) => v == null || v === "" ? "" : `<div><dt>${esc(k)}</dt><dd>${v}</dd></div>`;
  const map = s.latitude != null
    ? ` <a href="https://www.openstreetmap.org/?mlat=${s.latitude}&mlon=${s.longitude}#map=11/${s.latitude}/${s.longitude}" target="_blank" rel="noreferrer">map</a>` : "";
  return `
    <p style="margin-top:1.25rem"><a href="#/v/${encodeURIComponent(s.visitor_id)}">← ${esc(s.visitor_label || "This visitor")}</a></p>
    <div class="big">${esc(s.visitor_label || s.org_label)} ${verdictTag(s.score.verdict)} ${s.is_bot ? tag("bot", s.bot_reason) : ""}</div>
    <p class="muted" style="margin:0">${esc(stamp(s.started_at))} · ${dur(s.total_ms)} on screen · ${s.max_scroll_pct}% scrolled · ${s.event_count} events</p>

    <div class="cols">
      <div><h2>Why it looks that way</h2>${reasonsList(s.score.reasons)}</div>
      <div><h2>Timeline</h2>${timeline(events, s.started_at)}</div>
    </div>

    <h2>Everything known</h2>
    <dl class="facts">
      ${fact("Network", `${esc(s.org || "–")} ${tag(s.org_kind)}${s.is_proxy ? " " + tag("hosting", "proxy") : ""}`)}
      ${fact("AS", esc([s.asn, s.as_domain].filter(Boolean).join(" · ")))}
      ${fact("IP", esc(s.ip))}
      ${fact("Place", esc([s.city, s.region, s.postal, s.country].filter(Boolean).join(", ")) + map)}
      ${fact("Timezone", esc(`${s.client_tz || "?"} (browser)` + (s.ip_timezone ? ` · ${s.ip_timezone} (IP)` : "")) + (vpn ? ' <span class="em">mismatch: VPN or travel</span>' : ""))}
      ${fact("Language", esc(s.lang))}
      ${fact("Came from", esc(s.referrer || "direct / no referrer"))}
      ${fact("Tracked link", s.link_code ? esc(`${s.link_label || "(no link made)"} · ${s.link_code}${s.src ? "" : " (first visit)"}`) : "")}
      ${fact("UTM", esc([s.utm_source, s.utm_medium, s.utm_campaign].filter(Boolean).join(" / ")))}
      ${fact("Landed on", esc(`${s.landing_path || "/"} (${s.shell})`))}
      ${fact("Device", esc(device(s)) + (s.is_mobile_net ? " · mobile network" : ""))}
      ${fact("Screen", esc(s.screen_w ? `${s.screen_w}×${s.screen_h} screen · ${s.viewport_w}×${s.viewport_h} window` : `${s.viewport_w}×${s.viewport_h} window`))}
      ${fact("Visitor", `<a href="#/v/${encodeURIComponent(s.visitor_id)}">${esc(s.visitor_id)}</a> · visit ${s.visitor_sessions}`)}
      ${fact("User agent", `<span class="muted">${esc(s.user_agent)}</span>`)}
      ${fact("Alerts sent", esc((s.alerts || []).join(", ")))}
    </dl>`;
}

function links(d) {
  const site = (l) => `${SITE}${l.target === "recruiters" ? "/recruiters" : "/"}?s=${l.code}`;
  const short = (l) => `${HERE}/go/${l.code}`;
  const urls = (l) => l.target === "resume"
    ? `<div class="row"><code>${esc(short(l))}</code> <button type="button" data-copy="${esc(short(l))}">Copy</button></div>`
    : `<div class="row"><code>${esc(site(l))}</code> <button type="button" data-copy="${esc(site(l))}">Copy</button></div>
       <div class="row faint">or <code>${esc(short(l))}</code> <button type="button" data-copy="${esc(short(l))}">Copy</button></div>`;
  return `
    <h2>Make a tracked link</h2>
    <form class="box" id="link-form">
      <label>For<input name="label" required maxlength="160" placeholder="Jane Doe, Amazon SDE intern"></label>
      <label>They are
        <select name="kind"><option value="recruiter">a recruiter</option><option value="friend">a friend</option><option value="channel">a channel (LinkedIn, résumé…)</option></select>
      </label>
      <label>Opens
        <select name="target"><option value="site">the site</option><option value="recruiters">the recruiter view</option><option value="resume">the résumé PDF</option></select>
      </label>
      <label>Code (optional)<input name="code" maxlength="48" pattern="[A-Za-z0-9][A-Za-z0-9_\\-]*" placeholder="made from the name"></label>
      <div class="row"><button class="primary" type="submit">Make link</button><span id="link-err" class="err" role="alert"></span></div>
    </form>
    ${MADE ? `<div class="made" role="status"><b>${esc(MADE.label)}</b>${urls(MADE)}</div>` : ""}
    <p class="faint">Give each recruiter their own link and you'll know when they open it, even weeks later: a visitor keeps the link they first came through.
    Links to the PDF go through ${esc(HERE)}/go/, since a PDF can't report itself.</p>

    <h2>Links</h2>
    ${table(["For", "Kind", "URL", { t: "Visits", n: 1 }, { t: "Clicks", n: 1 }, "Last opened", ""],
      d.links.map((l) => `<tr>
        <td class="w">${esc(l.label)}${l.previews ? ` <span class="faint">· previewed ${l.previews}×</span>` : ""}</td>
        <td>${tag(l.kind === "channel" ? "other" : l.kind, l.kind)}</td>
        <td>${urls(l)}</td>
        <td class="n ${l.visits ? "em" : "muted"}">${l.visits || "–"}</td>
        <td class="n">${l.clicks || "–"}</td>
        <td class="muted">${esc(when([l.last_visit, l.last_click].filter(Boolean).sort().at(-1)))}</td>
        <td><button type="button" class="danger" data-act="unlink" data-code="${esc(l.code)}" aria-label="Delete ${esc(l.label)}">Delete</button></td></tr>`),
      "No links yet.")}

    ${d.strays.length ? `<h2>Codes seen without a link</h2>
      ${table(["Code", { t: "Visits", n: 1 }, "Last"], d.strays.map((s) => `<tr><td>${esc(s.code)}</td><td class="n">${s.visits}</td><td class="muted">${esc(when(s.last_visit))}</td></tr>`), "")}` : ""}

    <h2>Count yourself out</h2>
    <p class="muted">Open <a href="${SITE}/?ay=me" target="_blank" rel="noreferrer">${SITE}/?ay=me</a> once in every browser you use.
    Those visits are still stored, marked as you and hidden unless <b>Me</b> is on. <code>?ay=notme</code> undoes it.</p>`;
}

function hits(d) {
  const previews = d.hits.filter((h) => h.kind === "preview");
  const clicks = d.hits.filter((h) => h.kind === "go");
  const by = new Map();
  for (const h of previews) by.set(h.platform, (by.get(h.platform) || 0) + 1);
  return `
    <h2>Where the site was shared</h2>
    <p class="faint" style="margin:-.25rem 0 .6rem">Each row is an app fetching the preview image because someone pasted a link. Apps cache, so a link pasted twice in one place may show once.
    iMessage fetches from the sender's phone, so its place is the sender's.</p>
    ${by.size ? `<div class="chips">${[...by].sort((a, b) => b[1] - a[1]).map(([p, n]) => `<span class="tag other">${esc(p)} · ${n}</span>`).join("")}</div>` : ""}
    ${table(["When", "App", "Link", "From", "Where"],
      previews.map((h) => `<tr><td class="muted">${esc(when(h.at))}</td><td>${esc(h.platform)}</td><td class="muted">${esc(h.code || "site")}</td>
        <td class="muted w">${esc(h.org || "–")}</td><td class="muted">${esc(place(h))}</td></tr>`),
      "No shares seen yet.")}

    <h2>Short link clicks</h2>
    ${table(["When", "Link", "Network", "Where", "Device"],
      clicks.map((h) => `<tr><td class="muted">${esc(when(h.at))}</td><td>${esc(h.code)}</td><td class="w">${esc(h.org || "–")} ${h.org_kind ? tag(h.org_kind) : ""}</td>
        <td class="muted">${esc(place(h))}</td><td class="muted w">${esc((h.user_agent || "").slice(0, 80))}</td></tr>`),
      "No short-link clicks yet.")}`;
}

// ---------------------------------------------------------------------------
// Shell
// ---------------------------------------------------------------------------

function controls() {
  $("#ctl").innerHTML = `
    ${[7, 30, 90, 365].map((n) => `<button type="button" data-days="${n}" aria-pressed="${n === DAYS}">${n}d</button>`).join("")}
    <button type="button" data-toggle="bots" aria-pressed="${BOTS}" title="Include visits classified as robots">Bots</button>
    <button type="button" data-toggle="me" aria-pressed="${ME}" title="Include your own visits">Me</button>
    <button type="button" data-act="refresh" aria-label="Refresh">↻</button>`;
}

async function load() {
  DATA = await api(`/api/query?days=${DAYS}${BOTS ? "&bots=1" : ""}${ME ? "&me=1" : ""}`);
  $("#sub").textContent = `aliyounes.dev · last ${DATA.days} days · ${DATA.bots.n} robot visit${DATA.bots.n === 1 ? "" : "s"} ${BOTS ? "included" : "hidden"}`;
  $("#gen").textContent = `updated ${new Date(DATA.generated_at).toLocaleTimeString()} · robots: ${DATA.bots.datacenter} datacentre, ${DATA.bots.ua} by user agent, ${DATA.bots.other} other`;
}

async function route() {
  const [, view = "", arg = ""] = location.hash.match(/^#\/?([^/]*)\/?(.*)$/) || [];
  for (const a of document.querySelectorAll("nav a")) {
    const target = a.getAttribute("href").slice(2);
    const current = view === target || (view === "v" && target === "visitors") || (view === "s" && target === "visits");
    a.toggleAttribute("aria-current", current);
    if (current) a.setAttribute("aria-current", "page");
  }
  const v = $("#view");
  try {
    if (view === "v") v.innerHTML = await visitorView(decodeURIComponent(arg));
    else if (view === "s") v.innerHTML = await sessionView(decodeURIComponent(arg));
    else {
      if (!DATA) await load();
      v.innerHTML = ({ visitors, visits, links, hits }[view] || overview)(DATA);
    }
  } catch (err) {
    if (err.gate) return gate();
    v.innerHTML = `<p class="err" style="margin-top:1.5rem">${esc(err.message)}</p>`;
  }
}

async function refresh() {
  DATA = null;
  await route();
}

document.addEventListener("click", async (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.days) { DAYS = +b.dataset.days; localStorage.setItem("ay.days", DAYS); controls(); return refresh(); }
  if (b.dataset.toggle === "bots") { BOTS = !BOTS; localStorage.setItem("ay.bots", BOTS ? "1" : "0"); controls(); return refresh(); }
  if (b.dataset.toggle === "me") { ME = !ME; localStorage.setItem("ay.me", ME ? "1" : "0"); controls(); return refresh(); }
  if (b.dataset.filter) { FILTER = b.dataset.filter; return route(); }
  if (b.dataset.copy) {
    await navigator.clipboard?.writeText(b.dataset.copy).catch(() => {});
    const t = b.textContent; b.textContent = "Copied"; setTimeout(() => (b.textContent = t), 1200);
    return;
  }
  const act = b.dataset.act;
  if (act === "refresh") return refresh();
  if (act === "signout") { await fetch("/api/auth", { method: "DELETE" }); return gate(); }
  if (act === "unlink" && confirm("Delete this link? Visits it brought in are kept.")) {
    await post({ action: "link.delete", code: b.dataset.code });
    return refresh();
  }
  if (act === "forget" && confirm("Erase this visitor and every visit they made? This can't be undone.")) {
    await post({ action: "forget", id: b.dataset.id });
    DATA = null;
    location.hash = "#/visitors";
  }
});

document.addEventListener("submit", async (e) => {
  const f = e.target;
  if (f.id === "label-form") {
    e.preventDefault();
    const fd = new FormData(f);
    await post({ action: "label", id: f.dataset.id, label: fd.get("label") || null, kind: fd.get("kind") || null, note: fd.get("note") || null });
    DATA = null;
    $("#saved").textContent = "Saved";
    setTimeout(route, 600);
  }
  if (f.id === "link-form") {
    e.preventDefault();
    const fd = new FormData(f);
    try {
      MADE = await post({ action: "link.create", ...Object.fromEntries(fd) });
      await refresh();
    } catch (err) {
      $("#link-err").textContent = err.message;
    }
  }
  if (f.id === "login") {
    e.preventDefault();
    const btn = $("button", f);
    btn.disabled = true;
    $("#err").textContent = "";
    try {
      await api("/api/auth", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ password: $("#pw").value }) });
      $("#pw").value = "";
      start();
    } catch (err) {
      $("#err").textContent = err.message;
    } finally {
      btn.disabled = false;
    }
  }
});

function gate() {
  $("#app").hidden = true;
  $("#gate").hidden = false;
  $("#pw").focus();
}

function start() {
  $("#gate").hidden = true;
  $("#app").hidden = false;
  controls();
  refresh();
}

window.addEventListener("hashchange", () => { window.scrollTo(0, 0); route(); });

// The overview and lists refresh themselves every minute while visible, so
// "on the site now" stays true without a reload.
setInterval(() => {
  const view = (location.hash.match(/^#\/?([^/]*)/) || [])[1] || "";
  if (document.visibilityState === "visible" && !$("#app").hidden && ["", "visitors", "visits", "hits"].includes(view)) refresh();
}, 60_000);

api("/api/auth").then((r) => (r.authed ? start() : gate())).catch(gate);
</script>
</body>
</html>
